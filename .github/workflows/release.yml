name: Release

# Tag a version to ship it (see "Branching & Releases" in AGENTS.md):
#   vX.Y.Z-N  (N = incrementing number, e.g. v0.5.0-1) -> GitHub pre-release, no winget.
#   vX.Y.Z    (e.g. v0.5.0)                            -> real release ("Latest") + winget PR.
# A stable tag must sit on a commit that is already on main (git flow: release/hotfix branches are
# merged into main first, then tagged). Pre-release tags can be cut from any branch. Auto-update is Velopack (see PORTING_NOTES.md), reading this repo's
# GitHub Releases directly — every asset `vpk pack`/`vpk upload` produces (Setup.exe, portable zip,
# releases.win.json, delta packages) must land on the release for installed apps to find the update,
# which is what `vpk upload github --publish` below does. This workflow does not notarize or sign
# with a certificate yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve tag and version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag)) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-\d+)?$') {
            throw "Tag '$tag' must look like vX.Y.Z (release) or vX.Y.Z-N (pre-release, N numeric)."
          }
          $version = $tag -replace '^v', ''
          $prerelease = ($tag -match '-').ToString().ToLower()
          if ($prerelease -eq 'false') {
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw "Stable tag '$tag' must point to a commit on main." }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Build and pack
        shell: pwsh
        run: ./script/release.ps1 -Version "${{ steps.meta.outputs.version }}" -Runtime win-x64

      # NOTE: unsigned. Windows code signing (signtool + an Authenticode certificate) is not yet
      # wired up — see PORTING_NOTES.md "Prossimi passi". SmartScreen will warn on first run until
      # this is added.
      #
      # First create the GitHub Release with the CLI zip attached (softprops/action-gh-release), then
      # `vpk upload github` adds the Velopack assets (Setup.exe, portable zip, releases.win.json,
      # delta packages) to that SAME release via --merge — vpk create's own release step and
      # softprops' are not run against two different releases for the same tag.
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AIUsage.NET ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/aiusage-cli-${{ steps.meta.outputs.version }}-win-x64.zip

      - name: Upload Velopack assets
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }} `
            --outputDir dist/Releases `
            --publish `
            --merge `
            $(if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { '--pre' }) `
            --releaseName "AIUsage.NET ${{ steps.meta.outputs.version }}" `
            --tag ${{ steps.meta.outputs.tag }}

  # Real releases only: opens the winget-pkgs PR for the new version (pre-releases are never
  # submitted). Needs a classic PAT with `public_repo` scope in the WINGET_TOKEN secret (GITHUB_TOKEN
  # cannot open PRs on microsoft/winget-pkgs) and a fork of microsoft/winget-pkgs on the token's
  # account. Runs in its own job so a winget problem never marks the GitHub release as failed.
  winget:
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: LuigiElleBalotta.AIUsageNET
          version: ${{ needs.release.outputs.version }}
          release-tag: ${{ needs.release.outputs.tag }}
          installers-regex: '-win-Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
